[project]
name = "chat-realtime-api"
version = "0.1.0"
description = "Realtime chat backend built with FastAPI, WebSocket, PostgreSQL and Redis"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "sidom", email = "projectlaniakea1108@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.5.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
]
